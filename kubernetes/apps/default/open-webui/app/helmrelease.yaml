---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: open-webui
  interval: 30m
  values:
    workload:
      kind: Deployment
    strategy:
      type: Recreate
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
    ollama:
      enabled: false
    pipelines:
      enabled: false
    enableOpenaiApi: false
    websocket:
      enabled: false
    extraEnvVars:
      OFFLINE_MODE: true
      ENABLE_SIGNUP: false
      JWT_EXPIRES_IN: 24h
      WEBUI_SESSION_COOKIE_SECURE: true
      WEBUI_SESSION_COOKIE_SAME_SITE: strict
      CORS_ALLOW_ORIGIN: https://chat.labx.sh
      FORWARDED_ALLOW_IPS: 10.42.0.0/16
      ENABLE_COMMUNITY_SHARING: false
      RAG_FILE_MAX_SIZE: "50"
      RAG_FILE_MAX_COUNT: "10"
      AUDIT_LOG_LEVEL: METADATA
      ENABLE_AUDIT_STDOUT: true
    extraEnvFrom:
      - secretRef:
          name: open-webui-secret
    containerSecurityContext:
      allowPrivilegeEscalation: false
      # capabilities: { drop: ["ALL"] }
      seccompProfile: { type: RuntimeDefault }
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
    extraInitContainers:
      - name: fix-data-permissions
        image: busybox:1.37
        command:
          - sh
          - -c
          - |
            chown -R 0:0 /app/backend/data
            find /app/backend/data -type d -exec chmod 755 {} +
            find /app/backend/data -type f -exec chmod 644 {} +
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "FOWNER"]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
        volumeMounts:
          - name: data
            mountPath: /app/backend/data
    persistence:
      enabled: true
      existingClaim: open-webui
    route:
      enabled: true
      hostnames:
        - chat.labx.sh
      parentRefs:
        - name: envoy-external
          namespace: network
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000;includeSubDomains
              - name: X-Frame-Options
                value: DENY
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: Permissions-Policy
                value: camera=(),microphone=(),geolocation=()
