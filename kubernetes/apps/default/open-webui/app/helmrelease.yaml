---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: open-webui
  interval: 30m
  values:
    workload:
      kind: Deployment
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
    ollama:
      enabled: false
    pipelines:
      enabled: false
    enableOpenaiApi: false
    websocket:
      enabled: false
    extraEnvVars:
      OFFLINE_MODE: true
      ENABLE_SIGNUP: false
    extraEnvFrom:
      - secretRef:
          name: open-webui-secret
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
    persistence:
      enabled: true
      existingClaim: open-webui
    route:
      enabled: true
      hostnames:
        - chat.labx.sh
      parentRefs:
        - name: envoy-internal
          namespace: network
