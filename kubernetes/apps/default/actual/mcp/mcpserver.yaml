---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: actual-mcp
spec:
  transportType: http
  httpTransport:
    targetPort: 3000
    path: /mcp
  deployment:
    image: docker.io/sstefanov/actual-mcp:v1.15.1@sha256:9d6b216146fcd5f59303945d4f47ee6cbfbdc12a4f6a66f52029507e4ad0cb93
    port: 3000
    args: ["--sse", "--enable-bearer", "--enable-write", "--port", "3000"]
    env:
      ACTUAL_BUDGET_SYNC_ID: d76b2292-c861-4fda-8b8d-b01c44feb019
      ACTUAL_DATA_DIR: /data
      ACTUAL_SERVER_URL: http://actual.default.svc.cluster.local:5006
      TMPDIR: /tmp
      TZ: Europe/Rome
    secretRefs:
      - name: actual-mcp-secret
    volumes:
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: data
        mountPath: /data
      - name: tmp
        mountPath: /tmp
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
