---
# Read-only, and deliberately without secrets, nodes/proxy, pods/exec or services/proxy
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-mcp
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - pods/status
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: [get, list, watch]
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apps
      - autoscaling
      - batch
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - metrics.k8s.io
      - networking.k8s.io
      - node.k8s.io
      - policy
      - rbac.authorization.k8s.io
      - resource.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
      - acme.cert-manager.io
      - agentgateway.dev
      - ceph.rook.io
      - cert-manager.io
      - cilium.io
      - externaldns.k8s.io
      - external-secrets.io
      - fluxcd.controlplane.io
      - gateway.envoyproxy.io
      - gateway.networking.k8s.io
      - grafana.integreatly.org
      - helm.toolkit.fluxcd.io
      - k8s.cni.cncf.io
      - kopiur.home-operations.com
      - kustomize.toolkit.fluxcd.io
      - miroir.home-operations.com
      - monitoring.coreos.com
      - notification.toolkit.fluxcd.io
      - observability.giantswarm.io
      - postgresql.cnpg.io
      - snapshot.storage.k8s.io
      - source.toolkit.fluxcd.io
      - talos.dev
      - tuppr.home-operations.com
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-mcp
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp
    namespace: default
