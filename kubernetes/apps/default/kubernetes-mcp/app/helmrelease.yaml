---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: kubernetes-mcp
  interval: 1h
  values:
    controllers:
      kubernetes-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: true
        containers:
          app:
            image:
              repository: ghcr.io/containers/kubernetes-mcp-server
              tag: v0.1.3@sha256:6347155616c49c78512114500688b50d275ddde7597b6a38cefe6f40a8c42c16
            env:
              TZ: Europe/Rome
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
    configMaps:
      config:
        data:
          config.toml: |-
            port = "8080"
            read_only = true
            stateless = true
            toolsets = ["core"]

            [[denied_resources]]
            group = ""
            version = "v1"
            kind = "Secret"
    service:
      app:
        ports:
          http:
            port: 8080
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/kubernetes-mcp-server/config.toml
            subPath: config.toml
            readOnly: true
      tmp:
        type: emptyDir
