---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/agentgateway.dev/agentgatewaybackend_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: kubernetes-mcp
spec:
  mcp:
    targets:
      - name: kubernetes
        static:
          host: kubernetes-mcp.default.svc.cluster.local
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-mcp-agentgateway
spec:
  parentRefs:
    - name: agentgateway-mcp
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: Exact
            value: /kubernetes
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/kubernetes
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: kubernetes-mcp
