---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-hub
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 1h
  values:
    controllers:
      matter-hub:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/riddix/home-assistant-matter-hub
              tag: 2.1.0@sha256:423b77e0467b2a9f1ff21f3c4b4fb0a03aa6a2d0bc47a8d2e3c352ddfed1516b
            env:
              TZ: Europe/Rome
              HAMH_HOME_ASSISTANT_URL: http://home-assistant.default.svc.cluster.local:8123/
              HAMH_HTTP_ALLOWED_HOSTS: "{{ .Release.Name }}.labx.sh"
              HAMH_HTTP_AUTH_USERNAME: admin
              HAMH_HTTP_PORT: &port 8482
              HAMH_LOG_LEVEL: info
              HAMH_MDNS_NETWORK_INTERFACE: net1
              HAMH_STORAGE_LOCATION: /config
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
        statefulset:
          volumeClaimTemplates:
            - name: config
              accessMode: ReadWriteOnce
              size: 1Gi
              storageClass: ceph-block
              dataSourceRef:
                apiGroup: kopiur.home-operations.com
                kind: Restore
                name: "{{ .Release.Name }}"
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot",
            "namespace": "kube-system",
            "ips": ["10.0.40.21/24"],
            "mac": "02:6B:38:73:40:21"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.labx.sh"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      tmp:
        type: emptyDir
