---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bifrost
spec:
  chartRef:
    kind: OCIRepository
    name: bifrost
  interval: 1h
  values:
    strategy:
      type: Recreate
    image:
      repository: mirror.gcr.io/maximhq/bifrost
      tag: v1.6.8@sha256:14f704fcee64de509c139d14458871a4221f71f28a397f2b4d92bbe092d7a63c
    podSecurityContext:
      runAsUser: 1000
    storage:
      mode: sqlite
      persistence:
        enabled: true
        existingClaim: bifrost
    bifrost:
      host: "::"
      authConfig:
        isEnabled: true
        existingSecret: bifrost-secret
        usernameKey: BIFROST_ADMIN_USERNAME
        passwordKey: BIFROST_ADMIN_PASSWORD
      encryptionKeySecret:
        name: bifrost-secret
        key: BIFROST_ENCRYPTION_KEY
      client:
        enforceAuthOnInference: true
        logRetentionDays: 30
