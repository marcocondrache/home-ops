---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bifrost
spec:
  chartRef:
    kind: OCIRepository
    name: bifrost
  interval: 1h
  values:
    strategy:
      type: Recreate
    image:
      repository: ghcr.io/maximhq/bifrost
      tag: v2.2.1@sha256:a8942692af7b4b89196cd8fc33653b7353488dfd58b24078fe793b8574a8084b
    podSecurityContext:
      runAsUser: 1000
    storage:
      mode: sqlite
      persistence:
        enabled: true
        existingClaim: bifrost
    bifrost:
      host: "::"
      authConfig:
        isEnabled: true
        existingSecret: bifrost-secret
        usernameKey: BIFROST_ADMIN_USERNAME
        passwordKey: BIFROST_ADMIN_PASSWORD
      encryptionKeySecret:
        name: bifrost-secret
        key: BIFROST_ENCRYPTION_KEY
      client:
        enforceAuthOnInference: true
        logRetentionDays: 30
