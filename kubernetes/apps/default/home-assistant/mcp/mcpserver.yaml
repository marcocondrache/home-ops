---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: home-assistant-mcp
spec:
  transportType: http
  httpTransport:
    targetPort: 80
    path: /mcp
  deployment:
    image: ghcr.io/homeassistant-ai/ha-mcp:9.3.0@sha256:8da893a58da84be7c6e2a8057dfac4fc74821bc5bf17676b5223e439e914db2b
    port: 80
    cmd: ha-mcp-web
    env:
      FASTMCP_CHECK_FOR_UPDATES: "off"
      # kmcp mounts its own read-only ConfigMap at /config
      HA_MCP_CONFIG_DIR: /data
      HA_MCP_DISABLE_UPDATE_CHECK: "true"
      HOMEASSISTANT_URL: http://home-assistant.default.svc.cluster.local:8123
      MCP_HEALTHZ: "true"
      MCP_HOST: 0.0.0.0
      MCP_PORT: "80"
      TZ: Europe/Rome
    secretRefs:
      - name: home-assistant-mcp-secret
    volumes:
      - name: data
        emptyDir:
          sizeLimit: 1Gi
    volumeMounts:
      - name: data
        mountPath: /data
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
