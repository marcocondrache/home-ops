---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
spec:
  chartRef:
    kind: OCIRepository
    name: pocket-id
  interval: 1h
  values:
    controllers:
      pocket-id:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.19.2-distroless@sha256:a21166a4eb513d2ffcbf815398480998d996a9e719cfba029395517658626f9e
            env:
              ALLOW_INSECURE_CALLBACK_URLS: false
              ALLOW_USER_SIGNUPS: disabled
              ANALYTICS_DISABLED: true
              APP_URL: https://id.labx.sh
              AUDIT_LOG_RETENTION_DAYS: 365
              CIMD_URL_ALLOWLIST: '["https://claude.ai/oauth/*"]'
              CLOUDFLARE_LOCATION_HEADERS: true
              EMAIL_API_KEY_EXPIRATION_ENABLED: true
              EMAIL_LOGIN_NOTIFICATION_MODE: browserRecognition
              EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED: false
              EMAIL_ONE_TIME_ACCESS_AS_UNAUTHENTICATED_ENABLED: false
              PORT: &port 1411
              SMTP_HOST: smtp-relay.default.svc.cluster.local
              SMTP_PORT: 25
              TRUST_PROXY: 10.42.0.0/16,fdf3:0f3a:242e:42::/108
              TZ: Europe/Rome
              UI_CONFIG_DISABLED: true
              VERSION_CHECK_DISABLED: true
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - id.labx.sh
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
