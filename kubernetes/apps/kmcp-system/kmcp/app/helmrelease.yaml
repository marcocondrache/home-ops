---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kmcp
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/kagent-dev/kmcp/helm/kmcp
      ref:
        tag: 0.4.0
  interval: 1h
  values:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
