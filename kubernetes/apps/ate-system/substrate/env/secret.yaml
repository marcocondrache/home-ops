---
apiVersion: v1
kind: Secret
metadata:
  name: ate-api-server-secret-envvars
stringData:
  # username and password come from the CloudNativePG substrate-app Secret.
  # Both pools use the substrate login, which is a member of substrate_owner
  # and substrate_readwrite. ateapi runs SET ROLE after connecting.
  ATE_API_POSTGRES_OWNER_CONNECTION_STRING: postgresql://${username}:${password}@substrate-rw.ate-system.svc.cluster.local:5432/atepg?sslmode=require
  ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING: postgresql://${username}:${password}@substrate-rw.ate-system.svc.cluster.local:5432/atepg?sslmode=require
  ATE_API_POSTGRES_SCHEMA: substrate
