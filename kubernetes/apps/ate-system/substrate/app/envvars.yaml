---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-api-server-envvars
data:
  ATE_API_POSTGRES_OWNER_ROLE: substrate_owner
  ATE_API_POSTGRES_READ_WRITE_ROLE: substrate_readwrite
  ATE_API_POSTGRES_POOL_MAX_CONNS: "4"
  # ate-api and atelet both default ATE_STORAGE_BACKEND to gcs in their
  # manifests, which overrides this ConfigMap. Workloads have to set s3
  # themselves or they exit trying to build a GCS client. The endpoint is the
  # rustfs Service in this namespace.
  ATE_STORAGE_BACKEND: s3
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://rustfs.ate-system.svc:9000
  AWS_S3_USE_PATH_STYLE: "true"
