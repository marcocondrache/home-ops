---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-mcp
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == 404", "[BODY] == route not found"]
spec:
  hostnames:
    - mcp.labx.sh
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: agentgateway-mcp
          port: 8080
